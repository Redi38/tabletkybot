{% extends "sqladmin/layout.html" %}

{% block head %}
    {{ super() }} <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    .custom-font { font-family: 'Nunito', sans-serif !important; }
    .logs-toolbar { gap: 0.5rem; flex-wrap: wrap; }

    .logs-box {
        background: #0f1115;
        color: #d6d9de;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.83rem;
        line-height: 1.45;
        border-radius: 8px;
        height: 65vh;
        overflow: auto;
    }
    .logs-empty { color: #6c757d; text-align: center; padding: 2rem; }

    /* ── Column header (sticky) ─────────────────────────────────── */
    .log-header {
        display: flex;
        gap: 0.75rem;
        position: sticky;
        top: 0;
        z-index: 2;
        background: #161920;
        border-bottom: 1px solid #262b36;
        padding: 0.4rem 1rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6c7480;
    }
    .log-header .lc-time { width: 10.5rem; flex-shrink: 0; }
    .log-header .lc-level { width: 4.5rem; flex-shrink: 0; }
    .log-header .lc-ctx { width: 9rem; flex-shrink: 0; }
    .log-header .lc-module { width: 11rem; flex-shrink: 0; }
    .log-header .lc-msg { flex: 1; }

    /* ── Row ─────────────────────────────────────────────────────── */
    .log-row {
        display: flex;
        gap: 0.75rem;
        padding: 0.28rem 1rem;
        border-bottom: 1px solid #1a1d24;
        white-space: pre-wrap;
        word-break: break-word;
        cursor: pointer;
    }
    .log-row:nth-child(even) { background: #12151b; }
    .log-row:hover { background: #1c2230; }
    .log-row.copied { background: #1f3b2c !important; }

    .lc-time { width: 10.5rem; flex-shrink: 0; color: #6c7480; }
    .lc-ctx { width: 9rem; flex-shrink: 0; color: #8a93a3; overflow: hidden; text-overflow: ellipsis; }
    .lc-module { width: 11rem; flex-shrink: 0; color: #5b6472; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lc-msg { flex: 1; color: #d6d9de; }
    .log-row-raw .lc-msg { color: #9aa2ae; } /* line didn't match the expected format */

    /* ── Level badges ────────────────────────────────────────────── */
    .lvl-badge {
        width: 4.5rem;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        height: 1.3rem;
    }
    .lvl-INFO { background: #1b2a3d; color: #7cc4ff; }
    .lvl-WARNING { background: #3d331a; color: #ffd166; }
    .lvl-ERROR, .lvl-CRITICAL { background: #3d1a1e; color: #ff6b6b; }

    /* ── Context (cid) chips, colored by event type ─────────────── */
    .ctx-chip { display: inline-flex; align-items: center; gap: 0.3rem; }
    .ctx-button, .ctx-message { color: #7cc4ff; }
    .ctx-job { color: #b98cff; }
    .ctx-adminsync { color: #ffd166; }
    .ctx-none { color: #4b515c; }

    /* ── Inline semantic highlights inside the message ──────────── */
    .hl-user {
        color: #9fe3a0;
        cursor: pointer;
        border-bottom: 1px dotted #4a5a4a;
    }
    .hl-user:hover { color: #c7f5c8; }
    .hl-id {
        background: #22262f;
        color: #c9cfda;
        border-radius: 3px;
        padding: 0 0.3rem;
    }
    .hl-action-take { color: #7ee787; font-weight: 600; }
    .hl-action-skip { color: #ff9d7a; font-weight: 600; }

    /* ── Correlation-id groups ───────────────────────────────────── */
    .log-group-header {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.28rem 1rem;
        border-bottom: 1px solid #1a1d24;
        cursor: pointer;
    }
    .log-group:nth-child(even) > .log-group-header { background: #12151b; }
    .log-group-header:hover { background: #1c2230; }
    .log-group.expanded > .log-group-header { background: #171b24; }

    .group-count { color: #6c7480; font-weight: 600; }
    .group-summary { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .group-caret { color: #6c7480; flex-shrink: 0; }

    .log-group-body {
        border-left: 2px solid #262b36;
        margin-left: 1rem;
    }
    .log-group-body .log-row { padding-left: 0.75rem; }
</style>

<div class="page-wrapper custom-font">
    <div class="page-body">
        <div class="container-xl mt-4">

            <div class="card shadow-sm mb-3">
                <div class="card-header">
                    <h2 class="card-title"><b>Logs</b></h2>
                </div>
                <div class="card-body">

                    <div class="d-flex logs-toolbar align-items-center mb-3">
                        <select id="logSource" class="form-select" style="width: auto;">
                            <option value="bot">Bot</option>
                            <option value="admin">Admin panel</option>
                        </select>

                        <select id="logLevel" class="form-select" style="width: auto;">
                            <option value="">All levels</option>
                            <option value="INFO">INFO</option>
                            <option value="WARNING">WARNING</option>
                            <option value="ERROR">ERROR</option>
                            <option value="CRITICAL">CRITICAL</option>
                        </select>

                        <select id="logLines" class="form-select" style="width: auto;">
                            <option value="100">100 lines</option>
                            <option value="200" selected>200 lines</option>
                            <option value="500">500 lines</option>
                        </select>

                        <input id="logSearch" type="text" class="form-control" style="width: 220px;" placeholder="Search text...">

                        <button id="refreshBtn" class="btn btn-primary" onclick="refreshLogs()">Refresh</button>

                        <button id="downloadBtn" class="btn btn-outline-secondary" onclick="downloadLogs()">
                            Download
                        </button>

                        <div class="form-check form-switch ms-2 mb-0">
                            <input class="form-check-input" type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()">
                            <label class="form-check-label" for="autoRefreshToggle">Auto-refresh (15s)</label>
                        </div>

                        <span id="logStatus" class="text-secondary ms-auto"></span>
                    </div>

                    <div class="logs-box">
                        <div class="log-header">
                            <span class="lc-time">Time</span>
                            <span class="lc-level">Level</span>
                            <span class="lc-ctx">Context</span>
                            <span class="lc-module">Module</span>
                            <span class="lc-msg">Message</span>
                        </div>
                        <div id="logsBox">
                            <div class="logs-empty">Loading...</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    let autoRefreshInterval = null;

    // Bot lines: "2026-08-06 16:01:15 | INFO | [upd:613277875] | bot.actions | [button] user=123 (@name) data='take_91'"
    // Admin lines have no [cid] segment: "2026-08-06 16:01:15 | INFO | admin.routes | Some message"
    const LINE_WITH_CID = /^(\S+ \S+) \| (\w+) \| \[(.*?)\] \| (\S+) \| ([\s\S]*)$/;
    const LINE_NO_CID = /^(\S+ \S+) \| (\w+) \| (\S+) \| ([\s\S]*)$/;

    function parseLine(line) {
        let m = line.match(LINE_WITH_CID);
        if (m) return { time: m[1], level: m[2], ctx: m[3], module: m[4], message: m[5] };
        m = line.match(LINE_NO_CID);
        if (m) return { time: m[1], level: m[2], ctx: "", module: m[3], message: m[4] };
        return null; // doesn't match the expected format (e.g. a wrapped traceback line) — shown raw
    }

    function ctxClass(ctx) {
        if (ctx.startsWith("upd:")) return "ctx-button"; // refined further below using the message prefix
        if (ctx.startsWith("job:")) return "ctx-job";
        if (ctx.startsWith("adminsync:")) return "ctx-adminsync";
        if (ctx === "-" || ctx === "") return "ctx-none";
        return "ctx-none";
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    // Applied to an already-escaped message string, so these patterns only
    // ever match plain text/digits/@handles — never raw HTML from the log.
    function highlightMessage(escapedMsg) {
        let out = escapedMsg
            // user=123456 (@handle) -> clickable chip that searches by handle (or id, if no handle)
            .replace(/user=(\d+)(\s*\(@([\w]+)\))?/g, (full, uid, _paren, handle) => {
                const term = handle || uid;
                return `<span class="hl-user" onclick="searchFor('${term}')" title="Filter logs by this user">${full}</span>`;
            })
            // id=42 / (id=42) — standalone numeric ids for medicines/prescriptions/etc.
            .replace(/\bid=(\d+)\b/g, '<span class="hl-id">id=$1</span>')
            .replace(/\btake_/g, '<span class="hl-action-take">take_</span>')
            .replace(/\bskip_/g, '<span class="hl-action-skip">skip_</span>');
        return out;
    }

    function searchFor(term) {
        document.getElementById("logSearch").value = term;
        refreshLogs();
    }

    function renderLine(line, index) {
        const parsed = parseLine(line);
        if (!parsed) {
            return `<div class="log-row log-row-raw" data-raw="${index}">
                <span class="lc-time"></span>
                <span class="lvl-badge"></span>
                <span class="lc-ctx"></span>
                <span class="lc-module"></span>
                <span class="lc-msg">${escapeHtml(line)}</span>
            </div>`;
        }
        const { time, level, ctx, module, message } = parsed;
        return `<div class="log-row" data-raw="${index}">
            <span class="lc-time">${escapeHtml(time)}</span>
            <span class="lvl-badge lvl-${level}">${escapeHtml(level)}</span>
            <span class="lc-ctx ${ctxClass(ctx)}"><span class="ctx-chip">${escapeHtml(ctx)}</span></span>
            <span class="lc-module">${escapeHtml(module)}</span>
            <span class="lc-msg">${highlightMessage(escapeHtml(message))}</span>
        </div>`;
    }

    let rawLines = [];
    // Which correlation-id groups are expanded — a plain module-level Set so
    // it survives across refreshLogs() calls (including auto-refresh),
    // instead of re-collapsing every group on every poll.
    const expandedGroups = new Set();

    const LEVEL_RANK = { INFO: 0, WARNING: 1, ERROR: 2, CRITICAL: 3 };

    // Groups nearby lines that share the same non-trivial correlation id
    // (e.g. "upd:613277875", "job:sync_reminders_hourly") into one block,
    // ordered by each group's first line — so a block can visually "pull
    // together" lines that were interleaved with other updates in the raw
    // file. Lines with no cid, cid "-" (uncorrelated/system lines), or
    // that don't match the expected line format at all are never grouped.
    // Recurring jobs (e.g. "job:sync_reminders_hourly") reuse the exact
    // same cid on every run — unlike "upd:12345", which is unique per
    // Telegram update — so matching purely by key would merge every
    // historical run in the page into one group anchored at its OLDEST
    // occurrence, burying dozens of separate runs behind one misleading
    // count at the top of the list. A group only keeps accepting lines
    // for its key while they stay within GROUP_GAP_MS of the last line
    // added to it; once a same-key line arrives after a bigger gap (i.e.
    // the next run, an hour/day later), it starts a new group instead.
    const GROUP_GAP_MS = 5 * 60 * 1000;

    function parseTimeMs(timeStr) {
        const ms = Date.parse(timeStr.replace(" ", "T"));
        return Number.isNaN(ms) ? null : ms;
    }

    function buildGroups(lines) {
        const groups = [];
        const openByKey = new Map(); // key -> { groupIndex, lastTimeMs }
        lines.forEach((line, index) => {
            const parsed = parseLine(line);
            const key = parsed && parsed.ctx && parsed.ctx !== "-" ? parsed.ctx : null;

            if (key !== null) {
                const timeMs = parsed ? parseTimeMs(parsed.time) : null;
                const open = openByKey.get(key);
                const withinGap = open && (timeMs === null || open.lastTimeMs === null || Math.abs(timeMs - open.lastTimeMs) <= GROUP_GAP_MS);

                if (withinGap) {
                    groups[open.groupIndex].entries.push({ line, index, parsed });
                    openByKey.set(key, { groupIndex: open.groupIndex, lastTimeMs: timeMs ?? open.lastTimeMs });
                    return;
                }
                openByKey.set(key, { groupIndex: groups.length, lastTimeMs: timeMs });
            }

            groups.push({ key, entries: [{ line, index, parsed }] });
        });
        return groups;
    }

    function worstLevel(entries) {
        let best = "INFO";
        let bestRank = -1;
        for (const e of entries) {
            if (!e.parsed) continue;
            const rank = LEVEL_RANK[e.parsed.level] ?? 0;
            if (rank > bestRank) {
                bestRank = rank;
                best = e.parsed.level;
            }
        }
        return best;
    }

    // Picks which entry the group header previews when collapsed — the
    // first [button]/[message] action-log line if there is one, else just
    // the group's first entry. Returned (not just its text) so the caller
    // can exclude this exact line from the expanded body — otherwise the
    // first row you'd see on expanding is always a repeat of the header.
    function pickSummaryEntry(entries) {
        const preferred = entries.find(e => e.parsed && (e.parsed.message.startsWith("[button]") || e.parsed.message.startsWith("[message]")));
        return preferred || entries[0];
    }

    function summaryText(entry) {
        let text = entry.parsed ? entry.parsed.message : entry.line;
        const MAX_LEN = 100;
        if (text.length > MAX_LEN) text = text.slice(0, MAX_LEN) + "…";
        return text;
    }

    function renderGroup(group) {
        if (group.key === null || group.entries.length === 1) {
            return group.entries.map(e => renderLine(e.line, e.index)).join("");
        }
        const entries = group.entries;
        const first = entries[0].parsed;
        const worst = worstLevel(entries);
        const isExpanded = expandedGroups.has(group.key);
        const summaryEntry = pickSummaryEntry(entries);
        const summary = summaryText(summaryEntry);
        // Everything except the line already shown in the header — avoids
        // showing that same line twice right after expanding.
        const bodyEntries = entries.filter(e => e !== summaryEntry);
        const bodyRows = bodyEntries.map(e => renderLine(e.line, e.index)).join("");

        return `<div class="log-group${isExpanded ? " expanded" : ""}">
            <div class="log-group-header" data-group-toggle="${escapeHtml(group.key)}">
                <span class="lc-time">${first ? escapeHtml(first.time) : ""}</span>
                <span class="lvl-badge lvl-${worst}">${escapeHtml(worst)}</span>
                <span class="lc-ctx ${ctxClass(group.key)}"><span class="ctx-chip">${escapeHtml(group.key)}</span></span>
                <span class="lc-module group-count">×${entries.length}</span>
                <span class="lc-msg group-summary">
                    <span>${highlightMessage(escapeHtml(summary))}</span>
                    <span class="group-caret">${isExpanded ? "▾" : "▸"}</span>
                </span>
            </div>
            <div class="log-group-body" style="display:${isExpanded ? "block" : "none"}">${bodyRows}</div>
        </div>`;
    }

    function toggleGroup(key, headerEl) {
        const expanded = expandedGroups.has(key);
        if (expanded) expandedGroups.delete(key);
        else expandedGroups.add(key);

        // Flip just this group's DOM in place instead of a full re-render,
        // so scroll position and every other group's expand state are
        // left untouched.
        const groupEl = headerEl.closest(".log-group");
        const body = groupEl.querySelector(".log-group-body");
        const caret = groupEl.querySelector(".group-caret");
        const nowExpanded = !expanded;
        groupEl.classList.toggle("expanded", nowExpanded);
        body.style.display = nowExpanded ? "block" : "none";
        if (caret) caret.textContent = nowExpanded ? "▾" : "▸";
    }

    function copyRow(rowEl) {
        const idx = Number(rowEl.getAttribute("data-raw"));
        const text = rawLines[idx];
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            rowEl.classList.add("copied");
            setTimeout(() => rowEl.classList.remove("copied"), 400);
        });
    }

    async function refreshLogs() {
        const box = document.getElementById("logsBox");
        const status = document.getElementById("logStatus");
        const source = document.getElementById("logSource").value;
        const level = document.getElementById("logLevel").value;
        const lines = document.getElementById("logLines").value;
        const search = document.getElementById("logSearch").value.trim();

        status.textContent = "Loading...";

        const params = new URLSearchParams({ source, lines, level, search });

        try {
            const response = await fetch(`/api/admin/logs?${params.toString()}`);
            if (!response.ok) throw new Error("Network or server error");
            const data = await response.json();

            if (!data.lines || data.lines.length === 0) {
                rawLines = [];
                box.innerHTML = '<div class="logs-empty">No entries match the selected filters.</div>';
            } else {
                rawLines = data.lines;
                const groups = buildGroups(data.lines);
                box.innerHTML = groups.map(renderGroup).join("");
                box.parentElement.scrollTop = box.parentElement.scrollHeight;
            }

            const now = new Date().toLocaleTimeString();
            status.textContent = `Updated at ${now} · ${data.lines.length} lines`;
        } catch (error) {
            status.textContent = "Error loading logs";
            console.error("Error loading logs:", error);
        }
    }

    document.getElementById("logsBox").addEventListener("click", (e) => {
        const toggle = e.target.closest("[data-group-toggle]");
        if (toggle) {
            toggleGroup(toggle.getAttribute("data-group-toggle"), toggle);
            return;
        }
        const row = e.target.closest(".log-row");
        if (row) copyRow(row);
    });

    function downloadLogs() {
        const source = document.getElementById("logSource").value;
        const level = document.getElementById("logLevel").value;
        const search = document.getElementById("logSearch").value.trim();

        const params = new URLSearchParams({ source, level, search });
        window.location.href = `/api/admin/logs/download?${params.toString()}`;
    }

    function toggleAutoRefresh() {
        const enabled = document.getElementById("autoRefreshToggle").checked;
        if (enabled) {
            // Deliberately infrequent (15s) and off by default, so
            // continuous polling doesn't add unnecessary server load.
            autoRefreshInterval = setInterval(refreshLogs, 15000);
        } else if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    document.getElementById("logSource").addEventListener("change", refreshLogs);
    document.getElementById("logLevel").addEventListener("change", refreshLogs);
    document.getElementById("logLines").addEventListener("change", refreshLogs);
    document.getElementById("logSearch").addEventListener("keydown", (e) => {
        if (e.key === "Enter") refreshLogs();
    });

    document.addEventListener("DOMContentLoaded", refreshLogs);
</script>
{% endblock %}
