name: Deploy

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Deploy to production
        run: |
          set -e
          cd /home/ubuntu/tgbot
          git fetch origin
          git checkout main
          git pull origin main
          docker compose up -d --build
          docker image prune -f
