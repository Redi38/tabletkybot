name: Deploy

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Record pre-deploy commit (for rollback)
        run: |
          cd /home/ubuntu/tgbot
          echo "PREV_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy to production
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          set -e
          cd /home/ubuntu/tgbot
          git fetch origin
          git checkout main
          git pull origin main
          docker compose up -d --build
          docker image prune -f

      - name: Wait for health checks
        id: health
        run: |
          set -e
          cd /home/ubuntu/tgbot
          for i in $(seq 1 30); do
            bot_status=$(docker inspect --format='{{.State.Health.Status}}' medbot_core 2>/dev/null || echo "missing")
            admin_status=$(docker inspect --format='{{.State.Health.Status}}' medbot_admin 2>/dev/null || echo "missing")
            echo "Attempt $i: bot=$bot_status admin=$admin_status"
            if [ "$bot_status" = "healthy" ] && [ "$admin_status" = "healthy" ]; then
              echo "All containers healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for containers to become healthy (last: bot=$bot_status admin=$admin_status)."
          exit 1

      - name: Notify success
        if: success()
        run: |
          cd /home/ubuntu/tgbot
          set -a; source .env; set +a
          SHORT_SHA=$(git rev-parse --short HEAD)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            -d text="✅ Deploy succeeded — ${SHORT_SHA} is live and healthy." > /dev/null

      - name: Roll back to previous commit
        if: failure()
        run: |
          set -e
          cd /home/ubuntu/tgbot
          echo "Rolling back to $PREV_SHA"
          git checkout "$PREV_SHA"
          docker compose up -d --build

      - name: Notify rollback
        if: failure()
        run: |
          cd /home/ubuntu/tgbot
          set -a; source .env; set +a
          SHORT_PREV=$(git rev-parse --short "$PREV_SHA")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            -d text="❌ Deploy failed health check — rolled back to ${SHORT_PREV}. Check GitHub Actions logs." > /dev/null
